version: '3.8'

# ============================================
# OMNITECH Intranet — Production Environment
# ============================================

services:
  # ---------------------
  # PostgreSQL 16
  # ---------------------
  postgres:
    image: postgres:16-alpine
    container_name: omnitech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------
  # Redis 7
  # ---------------------
  redis:
    image: redis:7-alpine
    container_name: omnitech-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------
  # Backend (NestJS)
  # ---------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: omnitech-backend
    restart: unless-stopped
    env_file:
      - .env
    # Exposé uniquement sur l'IP LAN pour BunkerWeb (reverse proxy frontal).
    # Le pare-feu système DOIT restreindre l'accès à l'IP de BunkerWeb.
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------
  # Frontend (Next.js)
  # ---------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: omnitech-frontend
    restart: unless-stopped
    env_file:
      - .env
    # Exposé uniquement sur l'IP LAN pour BunkerWeb (reverse proxy frontal).
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:3001:3001"
    depends_on:
      - backend
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------
  # OnlyOffice Docs Server
  # ---------------------
  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: omnitech-documentserver
    restart: unless-stopped
    # Accessible uniquement via BunkerWeb sur /onlyoffice/
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      SECURE_LINK_SECRET: ${ONLYOFFICE_SECURE_LINK_SECRET}
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G

  # Reverse proxy frontal : BunkerWeb (externe à cette stack).
  # Voir infra/bunkerweb.env pour la configuration.

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  onlyoffice-data:
    driver: local
  onlyoffice-logs:
    driver: local

networks:
  internal:
    driver: bridge
