# ============================================================================
# OMNITECH Intranet — Production Environment (compose v2 spec)
#
# Usage :
#   cp .env.prod.example .env.prod && vim .env.prod    # remplir tous les champs
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Stack complete (10 services + 1 optionnel) :
#   - postgres         : base de donnees ISO 27001 A.8.24
#   - redis            : cache + sessions
#   - meilisearch      : recherche full-text federee
#   - ollama           : LLM local (RAG + chatbot)
#   - documentserver   : OnlyOffice (edition Word/Excel/PowerPoint)
#   - stirling-pdf     : suite d'outils PDF (split / merge / OCR / sign)
#   - docuseal         : signatures electroniques (eIDAS, RGPD)
#   - backend          : NestJS API
#   - frontend         : Next.js SSR
#   - nginx            : reverse proxy frontal (TLS, headers de securite)
#   - watchtower       : auto-update des images (optionnel — voir profile)
#
# Reseau :
#   - omnitech-internal : reseau bridge isole, pas d'acces internet sortant
#                         pour les services data (postgres/redis/meili/ollama)
#   - omnitech-public   : reseau bridge expose (nginx + frontend uniquement)
#
# Secrets Docker (recommandation production) :
#   Les mots de passe et secrets ne sont PAS lus depuis .env.prod, mais depuis
#   /run/secrets/<nom> via le mecanisme natif `docker secret`. Voir bloc
#   `secrets:` en bas de fichier + DOCKER_COMPOSE_PROD.md pour l'init.
# ============================================================================

# Note : volontairement pas de `version:` (deprecie en compose v2)

# ---------------------------------------------------------------------------
# Defaults reutilisables (logging, restart, ulimits) — YAML anchors
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-restart: &default-restart
  restart: unless-stopped

x-healthcheck-defaults: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # =========================================================================
  # PostgreSQL 16 — Base relationnelle principale
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: omnitech-postgres
    <<: *default-restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # WAL niveau replica + tuning standard pour ~100 utilisateurs
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      <<: *default-healthcheck
      interval: 10s
      start_period: 30s
    logging: *default-logging
    networks:
      - omnitech-internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M

  # =========================================================================
  # Redis 7 — Cache, queues, sessions
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: omnitech-redis
    <<: *default-restart
    # Mot de passe via fichier (--requirepass-file n'existe pas, on lit avec sh)
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000'
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      <<: *default-healthcheck
      interval: 10s
      start_period: 10s
    logging: *default-logging
    networks:
      - omnitech-internal
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  # =========================================================================
  # Meilisearch — Recherche federee documents/wiki/news/tickets
  # =========================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: omnitech-meilisearch
    <<: *default-restart
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: INFO
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: "104857600"
      MEILI_MASTER_KEY_FILE: /run/secrets/meili_master_key
    secrets:
      - meili_master_key
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      <<: *default-healthcheck
      interval: 30s
      start_period: 15s
    logging: *default-logging
    networks:
      - omnitech-internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # =========================================================================
  # Ollama — LLM local (qwen2 / Mistral / bge-m3 embeddings)
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: omnitech-ollama
    <<: *default-restart
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      <<: *default-healthcheck
      interval: 30s
      start_period: 60s
    logging: *default-logging
    networks:
      - omnitech-internal
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 2G

  # =========================================================================
  # OnlyOffice Document Server — Edition collaborative
  # =========================================================================
  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: omnitech-documentserver
    <<: *default-restart
    environment:
      JWT_ENABLED: "true"
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      JWT_SECRET_FILE: /run/secrets/onlyoffice_jwt_secret
      SECURE_LINK_SECRET_FILE: /run/secrets/onlyoffice_secure_link_secret
    secrets:
      - onlyoffice_jwt_secret
      - onlyoffice_secure_link_secret
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthcheck || exit 1"]
      <<: *default-healthcheck
      interval: 30s
      start_period: 90s
    logging: *default-logging
    networks:
      - omnitech-internal
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # =========================================================================
  # Stirling PDF — Suite d'outils PDF (split / merge / OCR)
  # =========================================================================
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: omnitech-stirling-pdf
    <<: *default-restart
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      LANGS: "fr_FR,en_GB"
      SYSTEM_DEFAULTLOCALE: "fr_FR"
    volumes:
      - stirling-trainingdata:/usr/share/tesseract-ocr/5/tessdata
      - stirling-config:/configs
      - stirling-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/info/status"]
      <<: *default-healthcheck
      interval: 30s
      start_period: 60s
    logging: *default-logging
    networks:
      - omnitech-internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # =========================================================================
  # DocuSeal — Signatures electroniques eIDAS / RGPD
  # =========================================================================
  docuseal:
    image: docuseal/docuseal:latest
    container_name: omnitech-docuseal
    <<: *default-restart
    environment:
      FORCE_SSL: "true"
      WORKERS: "2"
      DATABASE_URL_FILE: /run/secrets/docuseal_database_url
      SECRET_KEY_BASE_FILE: /run/secrets/docuseal_secret_key
    secrets:
      - docuseal_database_url
      - docuseal_secret_key
    volumes:
      - docuseal-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      <<: *default-healthcheck
      interval: 30s
      start_period: 90s
    logging: *default-logging
    networks:
      - omnitech-internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # =========================================================================
  # Backend (NestJS) — API + workers
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      cache_from:
        - omnitech/backend:cache
    image: omnitech/backend:${IMAGE_TAG:-latest}
    container_name: omnitech-backend
    <<: *default-restart
    env_file:
      - .env.prod
    environment:
      # Override : surcharger DATABASE_URL pour pointer vers le secret + le service docker
      DATABASE_URL: "postgresql://${POSTGRES_USER}:$$(cat /run/secrets/postgres_password)@postgres:5432/${POSTGRES_DB}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      ONLYOFFICE_JWT_SECRET_FILE: /run/secrets/onlyoffice_jwt_secret
      MEILI_MASTER_KEY_FILE: /run/secrets/meili_master_key
      OLLAMA_URL: http://ollama:11434
      MEILI_HOST: http://meilisearch:7700
      ONLYOFFICE_INTERNAL_URL: http://documentserver
      DOCUSEAL_API_URL: http://docuseal:3000/api
      STIRLING_PDF_URL: http://stirling-pdf:8080
    secrets:
      - postgres_password
      - redis_password
      - jwt_access_secret
      - jwt_refresh_secret
      - meili_master_key
      - onlyoffice_jwt_secret
    volumes:
      - storage-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - omnitech-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      <<: *default-healthcheck
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "2.0"
        reservations:
          memory: 512M

  # =========================================================================
  # Frontend (Next.js standalone) — SSR + RSC
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    image: omnitech/frontend:${IMAGE_TAG:-latest}
    container_name: omnitech-frontend
    <<: *default-restart
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - omnitech-internal
      - omnitech-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      <<: *default-healthcheck
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  # =========================================================================
  # Nginx — Reverse proxy frontal (TLS, headers de securite, rate limit)
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: omnitech-nginx
    <<: *default-restart
    ports:
      - "${DOCKER_BIND_IP:-0.0.0.0}:80:80"
      - "${DOCKER_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Lecture seule des certificats Let's Encrypt (montes depuis le host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      <<: *default-healthcheck
      interval: 30s
      start_period: 10s
    logging: *default-logging
    networks:
      - omnitech-public
      - omnitech-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

  # =========================================================================
  # Watchtower — Auto-update images (OPTIONNEL — profile "auto-update")
  # Active avec : docker compose --profile auto-update up -d
  # =========================================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: omnitech-watchtower
    <<: *default-restart
    profiles:
      - auto-update
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"      # 24h
      WATCHTOWER_LABEL_ENABLE: "true"        # Opt-in via labels
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
      TZ: Europe/Paris
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging
    networks:
      - omnitech-internal

# ============================================================================
# Volumes nommes — persistance des donnees
# ============================================================================
volumes:
  postgres-data:
    name: omnitech_postgres_data
    driver: local
  redis-data:
    name: omnitech_redis_data
    driver: local
  meili-data:
    name: omnitech_meili_data
    driver: local
  ollama-models:
    name: omnitech_ollama_models
    driver: local
  storage-data:
    name: omnitech_storage_data
    driver: local
  onlyoffice-data:
    name: omnitech_onlyoffice_data
    driver: local
  onlyoffice-logs:
    name: omnitech_onlyoffice_logs
    driver: local
  stirling-trainingdata:
    name: omnitech_stirling_trainingdata
    driver: local
  stirling-config:
    name: omnitech_stirling_config
    driver: local
  stirling-logs:
    name: omnitech_stirling_logs
    driver: local
  docuseal-data:
    name: omnitech_docuseal_data
    driver: local
  nginx-cache:
    name: omnitech_nginx_cache
    driver: local

# ============================================================================
# Reseaux — segmentation interne / public
# ============================================================================
networks:
  omnitech-internal:
    name: omnitech-internal
    driver: bridge
    internal: false             # internal:true bloque tout sortant => pas viable
    ipam:                        # CIDR fixe pour eviter conflits avec reseau host
      config:
        - subnet: 172.30.0.0/24
  omnitech-public:
    name: omnitech-public
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

# ============================================================================
# Secrets Docker — montes en /run/secrets/<nom> dans les conteneurs
#
# Initialisation (une seule fois sur le host) :
#   echo "<long-random-string>" | docker secret create postgres_password -
#   echo "<another-secret>" | docker secret create redis_password -
#   ... (cf docs/infrastructure/DOCKER_COMPOSE_PROD.md)
#
# Hors Swarm, compose lit les secrets depuis ./secrets/<nom>.txt (mode "file").
# Mode swarm : commenter `file:` et decommenter `external: true` ci-dessous.
# ============================================================================
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_access_secret:
    file: ./secrets/jwt_access_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  meili_master_key:
    file: ./secrets/meili_master_key.txt
  onlyoffice_jwt_secret:
    file: ./secrets/onlyoffice_jwt_secret.txt
  onlyoffice_secure_link_secret:
    file: ./secrets/onlyoffice_secure_link_secret.txt
  docuseal_database_url:
    file: ./secrets/docuseal_database_url.txt
  docuseal_secret_key:
    file: ./secrets/docuseal_secret_key.txt
