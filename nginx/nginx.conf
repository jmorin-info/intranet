# ============================================
# OMNITECH Intranet — Nginx Configuration
# ============================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------
    # JSON Access Log Format
    # ---------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ---------------------
    # Performance
    # ---------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # ---------------------
    # Client body size
    # ---------------------
    client_max_body_size 2G;
    client_body_buffer_size 256k;

    # ---------------------
    # Gzip Compression
    # ---------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml
        font/woff2;

    # ---------------------
    # Rate Limiting Zones
    # ---------------------
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=10r/m;

    limit_req_status 429;

    # ---------------------
    # Upstream Backends
    # ---------------------
    upstream backend {
        server backend:3000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3001;
        keepalive 32;
    }

    # ---------------------
    # HTTP -> HTTPS Redirect
    # ---------------------
    server {
        listen 80;
        listen [::]:80;
        server_name intranet.omnitech-security.fr;

        # Allow ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------
    # HTTPS Server
    # ---------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name intranet.omnitech-security.fr;

        # ---------------------
        # SSL Configuration
        # ---------------------
        ssl_certificate     /etc/letsencrypt/live/intranet.omnitech-security.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/intranet.omnitech-security.fr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ---------------------
        # Security Headers
        # ---------------------
        add_header X-Request-ID $request_id;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://intranet.omnitech-security.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ---------------------
        # API Routes
        # ---------------------
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            # Uploads > 1 Go nécessitent des timeouts longs (10 min)

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }

        # ---------------------
        # Auth Routes (stricter rate limit)
        # ---------------------
        location /api/auth/ {
            limit_req zone=api_auth burst=3 nodelay;

            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ---------------------
        # Upload Routes (specific rate limit)
        # ---------------------
        location /api/upload {
            limit_req zone=api_upload burst=5 nodelay;

            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            client_max_body_size 2G;
            proxy_request_buffering off;
        }

        # ---------------------
        # WebSocket (Socket.IO)
        # ---------------------
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ---------------------
        # Frontend (Next.js)
        # ---------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------
        # Next.js Static Assets — sert toujours en local (origine).
        #
        # Item 32 : si CDN configuré (NEXT_PUBLIC_CDN_URL=https://cdn.…),
        # le bundle Next contient déjà l'asset prefix → les browsers tapent
        # directement le CDN. Cette location reste active comme FALLBACK
        # ORIGINE en cas de panne CDN (DNS, Bunny down) : elle continue de
        # servir les assets si on retire le prefix côté frontend ou si un
        # navigateur utilise une URL non préfixée (ex: cache stale).
        # ---------------------
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # ---------------------
        # CDN fallback (Item 32) — `/cdn-fallback/*` permet à un opérateur
        # de forcer le routing direct vers l'origine en cas de panne CDN
        # sans toucher au DNS (ex: depuis un script runbook, on bascule
        # NEXT_PUBLIC_CDN_URL vers https://intranet.omnitech-security.fr/cdn-fallback
        # le temps que le CDN remonte).
        # ---------------------
        location /cdn-fallback/ {
            rewrite ^/cdn-fallback/(.*)$ /$1 break;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cache-Control identique au CDN pour cohérence.
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header X-CDN-Fallback "origin" always;
        }

        # ---------------------
        # Deny hidden files
        # ---------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
