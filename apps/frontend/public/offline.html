<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — OMNITECH Security</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F5F5;
      color: #2C2C2C;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: #004469;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #001F33;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #6B6B6B;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .icon-offline {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      opacity: 0.6;
    }
    button {
      display: inline-block;
      padding: 0.625rem 1.5rem;
      background: #004469;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #00608F; }
    button:active { background: #003350; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">O</div>
    <div class="icon-offline">&#x1F50C;</div>
    <h1>Vous etes hors ligne</h1>
    <p>Impossible de se connecter au serveur OMNITECH. Verifiez votre connexion Internet puis reessayez.</p>
    <button onclick="window.location.reload()">Reessayer</button>
  </div>
</body>
</html>
