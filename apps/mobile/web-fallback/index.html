<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>OMNITECH Intranet</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#004469" />
    <!--
      Fallback embedded dans le binaire iOS / Android.
      Cette page est affichee UNIQUEMENT si :
        - server.url est unreachable au cold start (offline + no cache)
        - capacitor.config.ts est mal configure (server.url manquant)
      En conditions normales, la WebView est immediatement redirigee vers
      https://intranet.omnitech-security.fr — l'utilisateur ne voit JAMAIS
      cette page.
      Cf. docs/mobile/ARCHITECTURE.md §5 (choix webDir).
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Verdana,
          Geneva,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #004469;
        color: #fff;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 600;
      }
      p {
        margin: 4px 0;
        opacity: 0.85;
        font-size: 16px;
        max-width: 360px;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #f68d2e;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin: 24px auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        background: #f68d2e;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #f9964a;
      }
    </style>
  </head>
  <body>
    <h1>OMNITECH Intranet</h1>
    <p id="status">Chargement de l'application...</p>
    <div class="spinner" aria-hidden="true"></div>
    <p>
      Si le chargement persiste, verifie ta connexion reseau et tape sur le
      bouton ci-dessous.
    </p>
    <button id="retry">Reessayer</button>

    <script>
      // Tenter de re-naviguer vers le serveur prod si l'utilisateur est
      // arrive ici (signe que server.url n'a pas charge).
      var target = "https://intranet.omnitech-security.fr/";
      document.getElementById("retry").addEventListener("click", function () {
        document.getElementById("status").textContent = "Reconnexion...";
        window.location.href = target;
      });
      // Auto-retry une fois apres 3 secondes (cas du splash trop court +
      // backend lent au cold start).
      setTimeout(function () {
        if (
          window.location.protocol === "capacitor:" ||
          window.location.protocol === "file:"
        ) {
          window.location.href = target;
        }
      }, 3000);
    </script>
  </body>
</html>
