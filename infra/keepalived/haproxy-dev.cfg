# =============================================================================
# HAProxy DEV — simule la VIP keepalived (docker-compose.ha.yml)
# Le check Patroni /master retourne 200 sur le leader, 503 sur les replicas
# =============================================================================
global
    maxconn 100
    log stdout format raw local0

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

# Stats UI : http://localhost:7000
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Leader (writes) — port 5432 → backend qui répond 200 sur /master
listen postgres_master
    bind *:5432
    option httpchk GET /master
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008
    server patroni-3 patroni-3:5432 maxconn 100 check port 8008

# Replicas (reads) — optionnel, pour load-balance des SELECT
listen postgres_replicas
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008
    server patroni-3 patroni-3:5432 maxconn 100 check port 8008
