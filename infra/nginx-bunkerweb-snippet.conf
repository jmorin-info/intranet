# =============================================================================
# OMNITECH Intranet — BunkerWeb / nginx reverse-proxy snippet
# Copier dans /etc/bunkerweb/configs/server-http/intranet.conf
# (ou /etc/nginx/sites-enabled/intranet.conf en mode nginx classique)
#
# Hypothèses :
#   - Frontend Next.js   : 127.0.0.1:3001
#   - Backend  NestJS    : 127.0.0.1:3000  (chemin /api/*)
#   - OnlyOffice DocsSrv : 127.0.0.1:8082  (chemin /onlyoffice/*)
#   - WebSocket Nest     : 127.0.0.1:3000  (chemin /ws ou /socket.io)
#   - TLS terminé par BunkerWeb (Let's Encrypt) — ne PAS écouter en clair sur :443
# =============================================================================

# ---- Upstream pools ---------------------------------------------------------
upstream omnitech_backend  { server 127.0.0.1:3000; keepalive 32; }
upstream omnitech_frontend { server 127.0.0.1:3001; keepalive 32; }
upstream onlyoffice_ds     { server 127.0.0.1:8082; keepalive 32; }

# ---- Common proxy headers ---------------------------------------------------
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_read_timeout  300s;
proxy_send_timeout  300s;
proxy_buffering     off;

# Body size : aligné sur UPLOAD_MAX_SIZE_MB (.env), +5MB de marge
client_max_body_size 55m;

# ---- Backend API (REST + GraphQL si besoin) ---------------------------------
location /api/ {
    proxy_pass http://omnitech_backend;
}

# ---- WebSocket (notifications, RAG streaming, chat) -------------------------
location ~ ^/(ws|socket\.io)/ {
    proxy_pass http://omnitech_backend;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

# ---- OnlyOffice Document Server --------------------------------------------
location /onlyoffice/ {
    rewrite ^/onlyoffice/(.*)$ /$1 break;
    proxy_pass http://onlyoffice_ds;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- Health-check public (pour BunkerWeb / load-balancer) -------------------
location = /healthz {
    proxy_pass http://omnitech_backend/api/health;
    access_log off;
}

# ---- Frontend Next.js (catch-all, doit rester EN DERNIER) -------------------
location / {
    proxy_pass http://omnitech_frontend;
    proxy_set_header Upgrade    $http_upgrade;   # Next dev HMR / RSC
    proxy_set_header Connection "upgrade";
}

# ---- Sécurité : bloquer accès direct aux fichiers sensibles -----------------
location ~* /\.(env|git|svn|hg)(/|$) { deny all; return 404; }
location ~* /(node_modules|\.next/cache)/ { deny all; return 404; }
