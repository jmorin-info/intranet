# =============================================================================
# Patroni — node 3 (REPLICA / candidat MASTER ; idéal pour load balancing reads)
# =============================================================================

scope: omnitech-intranet
namespace: /service/
name: pg-node-3

restapi:
  listen: 0.0.0.0:8008
  connect_address: 10.33.120.53:8008
  authentication:
    username: patroni
    password: ${PATRONI_ADMIN_PASSWORD}

etcd3:
  hosts: 10.33.120.51:2379,10.33.120.52:2379,10.33.120.53:2379
  protocol: https
  cacert: /etc/patroni/certs/etcd-ca.crt
  cert: /etc/patroni/certs/patroni-client.crt
  key: /etc/patroni/certs/patroni-client.key

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    master_start_timeout: 300
    synchronous_mode: false
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        max_connections: 200
        shared_buffers: 2GB
        effective_cache_size: 6GB
        work_mem: 16MB
        maintenance_work_mem: 512MB
        wal_buffers: 16MB
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 1GB
        archive_mode: "on"
        archive_command: "test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f"
        random_page_cost: 1.1
        effective_io_concurrency: 200
        log_min_duration_statement: 500
        log_checkpoints: "on"
        log_connections: "on"
        log_disconnections: "on"
        log_lock_waits: "on"
        log_autovacuum_min_duration: 0
        hot_standby_feedback: "on"
        synchronous_commit: "on"
        ssl: "on"
        ssl_cert_file: /etc/postgresql/certs/server.crt
        ssl_key_file: /etc/postgresql/certs/server.key
        ssl_ca_file: /etc/postgresql/certs/ca.crt
        password_encryption: scram-sha-256

  initdb:
    - encoding: UTF8
    - data-checksums
    - locale: fr_FR.UTF-8

  pg_hba:
    - hostssl replication replicator 10.33.120.0/24 scram-sha-256
    - hostssl replication replicator 127.0.0.1/32 scram-sha-256
    - hostssl all omnitech 10.33.120.0/24 scram-sha-256
    - hostssl all all 127.0.0.1/32 scram-sha-256
    - host all postgres 10.33.120.0/24 scram-sha-256

  users:
    admin:
      password: ${PATRONI_ADMIN_PASSWORD}
      options: [createrole, createdb]
    omnitech:
      password: ${POSTGRES_PASSWORD}
      options: [createdb]

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.33.120.53:5432
  data_dir: /var/lib/postgresql/16/main
  bin_dir: /usr/lib/postgresql/16/bin
  config_dir: /etc/postgresql/16/main
  pgpass: /tmp/pgpass0
  authentication:
    replication:
      username: replicator
      password: ${PATRONI_REPL_PASSWORD}
    superuser:
      username: postgres
      password: ${PATRONI_ADMIN_PASSWORD}
    rewind:
      username: rewind_user
      password: ${PATRONI_ADMIN_PASSWORD}
  parameters:
    unix_socket_directories: "/var/run/postgresql"

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

watchdog:
  mode: required
  device: /dev/watchdog
  safety_margin: 5

log:
  level: INFO
  dir: /var/log/patroni
  file_num: 14
  file_size: 25000000
