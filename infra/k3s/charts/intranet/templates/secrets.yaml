{{/*
Secret omnitech-secrets — créé UNIQUEMENT si secrets.useSealedSecrets=false.
En prod, on attend un SealedSecret (ou ExternalSecret) déjà appliqué qui
produit le Secret du même nom hors-chart, donc on ne le crée pas ici.
*/}}
{{- if not .Values.secrets.useSealedSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intranet.secretName" . }}
  labels:
    {{- include "intranet.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.plain }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
