{{- if .Values.stirlingPdf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "intranet.fullname" . }}-stirling
  labels:
    {{- include "intranet.labels" . | nindent 4 }}
    app.kubernetes.io/component: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "intranet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stirling-pdf
  template:
    metadata:
      labels:
        {{- include "intranet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stirling-pdf
    spec:
      containers:
        - name: stirling
          image: {{ include "intranet.image" (dict "repo" .Values.stirlingPdf.image.repository "tag" .Values.stirlingPdf.image.tag "global" .Values.global) }}
          ports:
            - name: http
              containerPort: {{ .Values.stirlingPdf.service.port }}
          env:
            - name: DOCKER_ENABLE_SECURITY
              value: "false"
            - name: LANGS
              value: "fr_FR,en_GB"
            - name: SYSTEM_DEFAULTLOCALE
              value: "fr_FR"
          resources:
            {{- toYaml .Values.stirlingPdf.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "intranet.fullname" . }}-stirling
  labels:
    {{- include "intranet.labels" . | nindent 4 }}
    app.kubernetes.io/component: stirling-pdf
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.stirlingPdf.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "intranet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: stirling-pdf
{{- end }}
