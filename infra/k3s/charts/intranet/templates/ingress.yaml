{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "intranet.fullname" . }}
  labels:
    {{- include "intranet.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "intranet.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /onlyoffice
            pathType: Prefix
            backend:
              service:
                name: {{ include "intranet.fullname" . }}-onlyoffice
                port:
                  number: {{ .Values.onlyoffice.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "intranet.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
