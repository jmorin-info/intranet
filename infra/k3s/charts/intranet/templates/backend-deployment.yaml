{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "intranet.fullname" . }}-backend
  labels:
    {{- include "intranet.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "intranet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "intranet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Force le rolling update si la config secrète change
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "intranet.image" (dict "repo" .Values.backend.image.repository "tag" .Values.backend.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.backend.service.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: REDIS_HOST
              value: {{ include "intranet.fullname" . }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: MEILI_HOST
              value: http://{{ include "intranet.fullname" . }}-meilisearch:7700
            - name: OLLAMA_URL
              value: http://{{ include "intranet.fullname" . }}-ollama:11434
            - name: ONLYOFFICE_INTERNAL_URL
              value: http://{{ include "intranet.fullname" . }}-onlyoffice:80
            - name: STIRLING_PDF_URL
              value: http://{{ include "intranet.fullname" . }}-stirling:8080
            - name: APP_URL
              value: https://{{ .Values.global.domain }}
            - name: CORS_ORIGINS
              value: https://{{ .Values.global.domain }}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "intranet.fullname" . }}-postgres:5432/$(POSTGRES_DB)?schema=public
            - name: POSTGRES_USER
              value: {{ .Values.postgres.env.POSTGRES_USER | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.env.POSTGRES_DB | quote }}
          envFrom:
            - secretRef:
                name: {{ include "intranet.secretName" . }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "intranet.fullname" . }}-storage
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "intranet.fullname" . }}-backend
  labels:
    {{- include "intranet.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "intranet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "intranet.fullname" . }}-storage
  labels:
    {{- include "intranet.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.backend.storage | default "20Gi" }}
{{- end }}
