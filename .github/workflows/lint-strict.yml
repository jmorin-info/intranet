name: Lint strict (frontend)

# Lint strict (zéro warning toléré) sur chaque PR.
# Le build local conserve `eslint.ignoreDuringBuilds: true` pour ne pas bloquer
# le développement, mais cette CI fait office de garde-fou progressif :
# toute nouvelle erreur/warning lint dans une PR fait échouer le job.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-strict:
    name: next lint --max-warnings 0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint strict (frontend)
        run: pnpm --filter @omnitech/frontend lint:strict
