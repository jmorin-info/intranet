name: Lint frontend

# Zéro erreur et zéro nouvel avertissement sur chaque PR. La dette existante
# reste inventoriée ; sa suppression progressive ne désactive aucune règle.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-strict:
    name: Lint frontend sans nouvelle dette
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint strict (frontend)
        run: node scripts/check-frontend-lint.cjs
