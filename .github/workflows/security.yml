name: Security

# Garde-fous de sécurité supply-chain :
#   1. gitleaks      — scan secrets dans le diff + l'historique
#   2. SBOM (syft)   — Software Bill of Materials (exigé NIS2 / ISO A.5.20)
#
# CodeQL (SAST) est dans un workflow séparé (codeql.yml).
# pnpm audit (deps vulnérables) est dans ci.yml (warn-only).

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. gitleaks — détection de secrets ─────────────────────────────────
  gitleaks:
    name: gitleaks (scan secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historique complet pour scan profond)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config locale .gitleaks.toml si présente, sinon règles par défaut.
          GITLEAKS_CONFIG: .gitleaks.toml

  # ─── 2. SBOM — inventaire des composants ────────────────────────────────
  sbom:
    name: SBOM (syft → SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: spdx-json
          output-file: "sbom.spdx.json"
          artifact-name: "sbom.spdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
