name: CI

on:
  push:
    branches:
      - main
      - feat/p1-9-prelaunch
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stub DATABASE_URL — Prisma validate / generate need a parseable URL but
  # never connect at CI time. Real DB only used in the e2e job (services).
  DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
  NEXT_TELEMETRY_DISABLED: "1"
  # Disable Husky hooks during CI install (no .git hooks dir in actions runner
  # for some checkouts and we don't want lint-staged to run on `pnpm install`).
  HUSKY: "0"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + Typecheck (backend, frontend, prisma)
  # ---------------------------------------------------------------------------
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C packages/database exec prisma generate

      - name: Typecheck backend
        run: pnpm -C apps/backend exec tsc --noEmit

      - name: Typecheck frontend
        run: pnpm -C apps/frontend exec tsc --noEmit

      - name: Prisma format check
        run: pnpm -C packages/database exec prisma format
        # `prisma format` rewrites in place. We follow with a git diff guard so
        # mis-formatted schema fails the job.
      - name: Fail if prisma format produced diff
        run: |
          if ! git diff --quiet -- packages/database/prisma/schema.prisma; then
            echo "::error::prisma schema is not formatted. Run 'pnpm -C packages/database exec prisma format' locally." >&2
            git --no-pager diff -- packages/database/prisma/schema.prisma
            exit 1
          fi

      - name: Prisma validate
        run: pnpm -C packages/database exec prisma validate

  # ---------------------------------------------------------------------------
  # 2. Build backend (NestJS)
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C packages/database exec prisma generate

      - name: Build backend
        run: pnpm -C apps/backend run build

  # ---------------------------------------------------------------------------
  # 3. Build frontend (Next.js 15)
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        # NODE_ENV=production at the job level would skip devDeps; install in dev mode then.
        run: NODE_ENV=development pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C packages/database exec prisma generate

      - name: Build frontend
        run: pnpm -C apps/frontend run build

  # ---------------------------------------------------------------------------
  # 4. E2E "compile-only" smoke
  # NOTE: Full e2e (login + seeded users + backend running) is out of scope for
  #       this minimal pipeline — see TODO at end of file. We only validate that
  #       the Playwright specs *parse and resolve imports* (`--list`), which
  #       still catches broken specs / missing helpers / TS errors in fixtures.
  # ---------------------------------------------------------------------------
  e2e-compile:
    name: E2E specs compile (--list)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C packages/database exec prisma generate

      - name: List Playwright specs (parse + resolve imports)
        # No browsers downloaded — `--list` only loads spec files and fails on
        # syntax / import errors. Filters for our two critical specs to make
        # the intent visible in the log.
        run: |
          pnpm exec playwright test --list
          echo "--- critical specs ---"
          pnpm exec playwright test --list \
            --grep "csp-hydration|gdpr-export" || true

      - name: Upload Playwright report (if present)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. Security audit (warn-only — does not fail the build)
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security audit (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high+)
        # Warn-only: 7 known high CVEs are being patched in parallel — we do not
        # want to block the pipeline on them. Re-tighten this once patched.
        run: pnpm audit --prod --audit-level=high || true

  # ---------------------------------------------------------------------------
  # 6. Prettier check (warn-only on first iteration to avoid mass churn)
  # ---------------------------------------------------------------------------
  prettier-check:
    name: Prettier check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm exec prettier --check "{apps,packages,e2e}/**/*.{ts,tsx,json,md}" || true

