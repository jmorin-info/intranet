[extend]
useDefault = true

[[rules]]
id = "omnitech-database-url-with-creds"
description = "PostgreSQL password embedded in a connection URL"
regex = '''postgres(?:ql)?://(?:[A-Za-z0-9_.-]+|\$\{[^}\s]+\}):([^@\s]{4,})@'''
secretGroup = 1

[[rules]]
id = "omnitech-jwt-secret"
description = "Hardcoded JWT or session secret"
regex = '''(?i)(?:jwt_(?:access|refresh)_secret|session_secret)\s*[=:]\s*['"]?([a-f0-9]{32,})'''
secretGroup = 1

# Only literal examples and variable references are ignored. Documentation,
# seed files and configuration templates are scanned like application code.
[allowlist]
description = "Explicit dummy fixtures and unresolved variable references"
regexes = [
  '''^CHANGE_ME$''',
  '''^changeme_[A-Za-z0-9_]*$''',
  '''^__GENERATED[A-Za-z0-9_]*__$''',
  '''^__SET_MANUALLY__$''',
  '''^PLACEHOLDER[A-Za-z0-9_]*$''',
  '''^stub$''',
  '''^test$''',
  '''^PASSWORD$''',
  '''^\{password\}$''',
  '''^<[^>\r\n]+>$''',
  '''^omnitech_dev$''',
  '''^\$\{[A-Z_][A-Z0-9_]*(?::-omnitech_dev)?\}$''',
  '''^\$\([A-Z_][A-Z0-9_]*\)$''',
  '''^abc123def456$''',
  '''^e2e-jwt-secret-must-be-at-least-32-chars-long$''',
  '''^e2e-refresh-secret-must-be-at-least-32-chars$''',
  '''^0123456789abcdef0123456789abcdef$''',
]
